<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        To-Let Finder
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="home-header">

    <h1>
        🏠 To-Let Finder
    </h1>


    <div class="home-search">

        <span>
            🔍
        </span>

        <input
            type="text"
            id="home-search"
            placeholder="Search for houses"
        >

        <button
            id="home-search-button"
            type="button"
        >
            Search
        </button>

    </div>


    <button
        class="profile-button"
        type="button"
        id="profile-button"
    >
        👤
    </button>

</header>


<main>


    <!-- ==========================================
         HERO / MAP COVER
    ========================================== -->

    <section class="hero-section">

        <img
            src="images/Map1.png"
            alt="Explore rental properties on map"
            class="hero-image"
        >

        <h2 class="map-cover-title">
            Find rentals through maps
        </h2>


        <div class="hero-content">

            <button
                id="explore-more-button"
                type="button"
            >
                Explore More
            </button>

        </div>

    </section>


    <!-- ==========================================
         FILTERS
    ========================================== -->

    <section
        class="filters-section"
        id="filters-section"
    >

        <button
            type="button"
            id="filters-toggle"
            aria-expanded="false"
        >

            <span>
                Filters
            </span>

            <span id="filters-arrow">
                ▼
            </span>

        </button>


        <div
            id="filters-panel"
            hidden
        >


            <!-- Maximum Rent -->

            <div
                class="filter-selector"
                data-filter="rent"
            >

                <span>
                    Maximum Rent
                </span>

                <span id="filter-rent-value">
                    Any
                </span>

            </div>


            <div
                class="filter-options"
                id="rent-options"
            >

                <button data-value="">
                    Any
                </button>

                <button data-value="5000">
                    ₹5,000
                </button>

                <button data-value="10000">
                    ₹10,000
                </button>

                <button data-value="15000">
                    ₹15,000
                </button>

                <button data-value="20000">
                    ₹20,000
                </button>

            </div>


            <!-- Property Type -->

            <div
                class="filter-selector"
                data-filter="property-type"
            >

                <span>
                    Property Type
                </span>

                <span id="filter-property-type-value">
                    Any
                </span>

            </div>


            <div
                class="filter-options"
                id="property-type-options"
            >

                <button data-value="">
                    Any
                </button>

                <button data-value="1 BHK">
                    1 BHK
                </button>

                <button data-value="2 BHK">
                    2 BHK
                </button>

                <button data-value="3 BHK">
                    3 BHK
                </button>

                <button data-value="House">
                    House
                </button>

                <button data-value="Apartment">
                    Apartment
                </button>

            </div>


            <!-- Bedrooms -->

            <div
                class="filter-selector"
                data-filter="bedrooms"
            >

                <span>
                    Bedrooms
                </span>

                <span id="filter-bedrooms-value">
                    Any
                </span>

            </div>


            <div
                class="filter-options"
                id="bedrooms-options"
            >

                <button data-value="">
                    Any
                </button>

                <button data-value="1">
                    1
                </button>

                <button data-value="2">
                    2
                </button>

                <button data-value="3">
                    3
                </button>

                <button data-value="4">
                    4
                </button>

                <button data-value="5">
                    5+
                </button>

            </div>


            <!-- Bathrooms -->

            <div
                class="filter-selector"
                data-filter="bathrooms"
            >

                <span>
                    Bathrooms
                </span>

                <span id="filter-bathrooms-value">
                    Any
                </span>

            </div>


            <div
                class="filter-options"
                id="bathrooms-options"
            >

                <button data-value="">
                    Any
                </button>

                <button data-value="1">
                    1
                </button>

                <button data-value="2">
                    2
                </button>

                <button data-value="3">
                    3
                </button>

                <button data-value="4">
                    4+
                </button>

            </div>


            <!-- Parking -->

            <div
                class="filter-selector"
                data-filter="parking"
            >

                <span>
                    Parking
                </span>

                <span id="filter-parking-value">
                    Any
                </span>

            </div>


            <div
                class="filter-options"
                id="parking-options"
            >

                <button data-value="">
                    Any
                </button>

                <button data-value="yes">
                    Yes
                </button>

                <button data-value="no">
                    No
                </button>

            </div>


            <!-- Water -->

            <div
                class="filter-selector"
                data-filter="water"
            >

                <span>
                    Water
                </span>

                <span id="filter-water-value">
                    Any
                </span>

            </div>


            <div
                class="filter-options"
                id="water-options"
            >

                <button data-value="">
                    Any
                </button>

                <button data-value="yes">
                    Yes
                </button>

                <button data-value="no">
                    No
                </button>

            </div>


            <div class="filter-actions">

                <button
                    type="button"
                    id="apply-filters"
                >
                    Apply Filters
                </button>

                <button
                    type="button"
                    id="clear-filters"
                >
                    Clear
                </button>

            </div>

        </div>

    </section>


    <!-- ==========================================
         AVAILABLE HOUSES
    ========================================== -->

    <section class="home-properties">

        <h2>
            Available Houses
        </h2>


        <div id="home-property-list">

            <p>
                Loading houses...
            </p>

        </div>

    </section>


</main>


<!-- Supabase -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- Existing project script -->

<script src="script.js"></script>


<!-- ==========================================
     LOGIN / SKIP LOGIN SYSTEM
========================================== -->

<script>

(async function() {

    /*
     * Check whether the user is already logged in.
     */

    if (
        typeof supabaseClient === "undefined"
    ) {

        return;

    }


    const {
        data
    } =
        await supabaseClient.auth.getSession();


    /*
     * If logged in:
     *
     * Allow the user to continue normally.
     */

    if (
        data &&
        data.session
    ) {

        return;

    }


    /*
     * If the user selected
     * "Skip Login" during this
     * browser session, allow access.
     */

    const skippedLogin =
        sessionStorage.getItem(
            "toletfinder_skip_login"
        );


    if (
        skippedLogin === "true"
    ) {

        return;

    }


    /*
     * Otherwise send the user
     * to the Login page.
     */

    window.location.replace(
        "login.html"
    );

})();


/* ==========================================
   PROFILE BUTTON
========================================== */

const profileButton =
    document.getElementById(
        "profile-button"
    );


if (profileButton) {

    profileButton.addEventListener(
        "click",
        function() {

            window.location.href =
                "profile.html";

        }
    );

}

</script>


</body>

</html>
