<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>To-Let Finder</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==============================
         HEADER
    =============================== -->

    <header class="home-header">

        <h1>
            🏠 To-Let Finder
        </h1>


        <div class="home-search">

            <span>
                🔍
            </span>

            <input
                type="text"
                id="home-search"
                placeholder="Search for houses"
            >

            <button
                id="home-search-button"
                type="button"
            >
                Search
            </button>

        </div>


        <button
            class="profile-button"
            type="button"
        >
            👤
        </button>

    </header>



    <!-- ==============================
         MAIN CONTENT
    =============================== -->

    <main>

        <div id="home-property-list">

            <p>
                Loading houses...
            </p>

        </div>

    </main>



    <!-- ==============================
         SUPABASE
    =============================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ==============================
         MAIN JAVASCRIPT
    =============================== -->

    <script src="script.js"></script>


</body>

</html>
