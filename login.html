<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - To-Let Finder
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .login-container {
            width: 90%;
            max-width: 380px;
            margin: 45px auto;
            padding: 24px;
            box-sizing: border-box;

            border: 1px solid #ddd;
            border-radius: 12px;

            background: white;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }


        .login-container h2 {
            text-align: center;
            margin-bottom: 8px;
        }


        .login-subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }


        .login-container label {
            display: block;
            margin: 14px 0 6px;

            font-size: 14px;
            font-weight: 600;
        }


        .login-container input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }


        .login-actions {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }


        .login-actions button {
            padding: 12px;

            border: 1px solid #222;
            border-radius: 6px;

            font-size: 15px;
            cursor: pointer;
        }


        #signup-button {
            background: #222;
            color: white;
        }


        #login-button {
            background: white;
            color: #222;
        }


        #login-message {
            margin-top: 16px;

            font-size: 14px;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }


        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #333;
        }

    </style>

</head>


<body>


<header>

    <h1>
        🏠 To-Let Finder
    </h1>

</header>


<main>


    <section class="login-container">


        <h2>
            Welcome!
        </h2>


        <p class="login-subtitle">
            Log in or create your To-Let Finder account.
        </p>


        <form id="account-form">


            <label for="email">
                Email address
            </label>


            <input
                type="email"
                id="email"
                autocomplete="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                autocomplete="current-password"
                minlength="6"
                placeholder="At least 6 characters"
                required
            >


            <div class="login-actions">


                <button
                    id="signup-button"
                    type="button"
                >
                    Sign Up
                </button>


                <button
                    id="login-button"
                    type="submit"
                >
                    Log In
                </button>


            </div>


        </form>


        <p
            id="login-message"
            role="status"
        >
            Enter your email and password.
        </p>


        <a
            class="back-home"
            href="index.html"
        >
            ← Back to Home
        </a>


    </section>


</main>


<!-- ==========================================
     SUPABASE
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>


/* ==========================================
   SUPABASE CONNECTION
========================================== */

const SUPABASE_URL =
    "https://amvzimxdycbulvxxmboq.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_LI8n64pscrtoMEW6FMk4_Q_r6K5J2XK";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==========================================
   ELEMENTS
========================================== */

const accountForm =
    document.getElementById(
        "account-form"
    );


const signupButton =
    document.getElementById(
        "signup-button"
    );


const message =
    document.getElementById(
        "login-message"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


/* ==========================================
   SIGN UP
========================================== */

signupButton.addEventListener(
    "click",
    async function() {


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            return;

        }


        if (password.length < 6) {

            message.textContent =
                "Password must contain at least 6 characters.";

            return;

        }


        signupButton.disabled = true;

        signupButton.textContent =
            "Creating account...";


        message.textContent =
            "Creating your account...";


        try {


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        emailRedirectTo:
                            "https://abhinav1320.github.io/ToLetFinder/"

                    }

                });


            if (error) {

                throw error;

            }


            if (
                data &&
                data.session
            ) {

                message.textContent =
                    "Account created successfully!";

                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );

            }

            else {

                message.textContent =
                    "Account created! Please check your email and confirm your account before logging in.";

            }


        }

        catch (error) {

            console.error(
                "Sign up error:",
                error
            );


            message.textContent =
                "❌ " + error.message;

        }


        signupButton.disabled = false;

        signupButton.textContent =
            "Sign Up";

    }

);


/* ==========================================
   LOG IN
========================================== */

accountForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            return;

        }


        message.textContent =
            "Logging in...";


        try {


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                throw error;

            }


            if (
                data &&
                data.user
            ) {

                message.textContent =
                    "✅ Login successful!";


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );

            }


        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.textContent =
                "❌ " + error.message;

        }

    }

);


/* ==========================================
   CHECK EXISTING SESSION
========================================== */

async function checkExistingSession() {


    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (
        data &&
        data.session
    ) {

        message.textContent =
            "You are already logged in.";

    }

}


checkExistingSession();


</script>


</body>

</html>
