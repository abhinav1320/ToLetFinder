

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Property Details - To-Let Finder
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>
        🏠 To-Let Finder
    </h1>

</header>


<main>

    <div class="property-details">


        <img
            id="property-image"
            src=""
            alt="Property Photo"
        >


        
<div class="property-title-row">
    <h2 id="property-title"></h2>

    <button
        type="button"
        id="like-property-button"
        class="like-property-button"
        aria-label="Like property"
        aria-pressed="false">
        ♡
    </button>
</div>



        <h3 id="property-rent"></h3>


        <p id="property-location"></p>


        <div class="property-info">


            <div>

                <span>🛏️</span>

                <strong id="property-bedrooms"></strong>

                <small>
                    Bedrooms
                </small>

            </div>


            <div>

                <span>🚿</span>

                <strong id="property-bathrooms"></strong>

                <small>
                    Bathrooms
                </small>

            </div>


            <div>

                <span>🚗</span>

                <strong id="property-parking"></strong>

                <small>
                    Parking
                </small>

            </div>


            <div>

                <span>💧</span>

                <strong id="property-water"></strong>

                <small>
                    Water
                </small>

            </div>


        </div>


        <h3>
            Description
        </h3>


        <p id="property-description"></p>


        <div class="owner-section">


            <h3>
                Property Owner
            </h3>


            <p id="property-owner"></p>


            <p id="property-phone"></p>


            <div class="contact-buttons">


                <a
                    id="call-owner"
                    class="search-button"
                >
                    📞 Call Owner
                </a>


                <a
                    id="whatsapp-owner"
                    class="search-button"
                >
                    💬 WhatsApp Message
                </a>


            </div>


        </div>


    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="script.js"></script>


</body>

</html>
